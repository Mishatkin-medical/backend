version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mishatkin-api-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_JWT_SECRET=${JWT_SECRET:-mishatkin-secret}
      - GATEWAY_RATE_LIMIT_PER_USER=100
      - GATEWAY_RATE_LIMIT_PER_IP=500
      - AUTH_SERVICE_URL=http://auth-service:8081
      - USER_SERVICE_URL=http://user-service:8082
      - DEVICE_SERVICE_URL=http://device-service:8083
      - GLUCOSE_SERVICE_URL=http://glucose-service:8084
      - INSULIN_SERVICE_URL=http://insulin-service:8085
      - DELIVERY_SERVICE_URL=http://delivery-service:8086
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - HISTORY_SERVICE_URL=http://history-service:8088
      - REDIS_URL=redis://redis:6379
    depends_on:
      - auth-service
    restart: unless-stopped